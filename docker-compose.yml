services:
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cutoutbg
      POSTGRES_USER: cutoutbg
      POSTGRES_PASSWORD: cutoutbg-dev
    ports: ['5432:5432']
  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: cutoutbg
      MINIO_ROOT_PASSWORD: cutoutbg-development
    ports: ['9000:9000','9001:9001']
