services:
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cutoutbg
      POSTGRES_USER: cutoutbg
      POSTGRES_PASSWORD: cutoutbg-dev
    ports: ['5432:5432']
    volumes: [./infrastructure/postgres:/docker-entrypoint-initdb.d:ro]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: cutoutbg
      MINIO_ROOT_PASSWORD: cutoutbg-development
    ports: ['9000:9000','9001:9001']
  api:
    build: .
    command: npm run server
    environment:
      PORT: 4100
      DATABASE_URL: postgresql://cutoutbg:cutoutbg-dev@postgres:5432/cutoutbg
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: cutoutbg-private
      S3_ACCESS_KEY: cutoutbg
      S3_SECRET_KEY: cutoutbg-development
    depends_on: [postgres, redis, minio]
    ports: ['4100:4100']
  worker:
    build: .
    command: npm run worker
    environment:
      DATABASE_URL: postgresql://cutoutbg:cutoutbg-dev@postgres:5432/cutoutbg
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: cutoutbg-private
      S3_ACCESS_KEY: cutoutbg
      S3_SECRET_KEY: cutoutbg-development
    depends_on: [postgres, redis, minio]
