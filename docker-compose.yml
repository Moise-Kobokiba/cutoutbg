services:
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cutoutbg
      POSTGRES_USER: cutoutbg
      POSTGRES_PASSWORD: cutoutbg-dev
    ports: ['5432:5432']
    volumes: [./infrastructure/postgres:/docker-entrypoint-initdb.d:ro, cutoutbg-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cutoutbg -d cutoutbg']
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: cutoutbg
      MINIO_ROOT_PASSWORD: cutoutbg-development
    ports: ['9000:9000','9001:9001']
    volumes: [cutoutbg-minio:/data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    command: npm run server
    environment:
      PORT: 4100
      DATABASE_URL: postgresql://cutoutbg:cutoutbg-dev@postgres:5432/cutoutbg
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: cutoutbg-private
      S3_ACCESS_KEY: cutoutbg
      S3_SECRET_KEY: cutoutbg-development
      MODEL_CACHE_DIR: /model-cache
      INFERENCE_DEVICE: cpu
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    ports: ['4100:4100']
    volumes: [cutoutbg-model-cache:/model-cache]
  worker:
    build: .
    command: npm run worker
    environment:
      DATABASE_URL: postgresql://cutoutbg:cutoutbg-dev@postgres:5432/cutoutbg
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: cutoutbg-private
      S3_ACCESS_KEY: cutoutbg
      S3_SECRET_KEY: cutoutbg-development
      MODEL_CACHE_DIR: /model-cache
      INFERENCE_DEVICE: cpu
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    volumes: [cutoutbg-model-cache:/model-cache]
volumes:
  cutoutbg-postgres:
  cutoutbg-minio:
  cutoutbg-model-cache:
